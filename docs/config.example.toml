# ~/.config/voidmaker/config.toml
# TypeScript Host 的模型配置；VOIDMAKER_CONFIG 可覆盖路径。修改后重启 Host。
# 不读取 ~/.codex/config.toml 的模型、推理强度或个性设置。
[agent]
model = "gpt-6-sol"
reasoning_effort = "medium"

[screen_awareness]
precheck_model = "gpt-6-luna"
precheck_reasoning_effort = "high"

[speech]
# UI / 历史始终显示中文；朗读台词独立生成。
language = "ja"

# ASR、TTS HTTP 端点及设备配置在同目录 voice.json。
# 桌面授权、常驻开关、时段和排除项由桌面面板管理，保存至 PostgreSQL。
